<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY Visa Buddy – Malaysia Visa Application Help</title>
<style>
:root{--bg:#f6f9fd;--sf:#fff;--tx:#10233f;--mu:#52627a;--br:#0b5fa8;--bi:#fff;--ac:#e8a818;--ln:#dde6f0;--tn:#eaf2fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--sf:#16223a;--tx:#eaf1fb;--mu:#9db0c8;--br:#4ea1ee;--bi:#06182e;--ac:#f0b72e;--ln:#27395a;--tn:#122340}}
:root[data-theme="dark"]{--bg:#0e1726;--sf:#16223a;--tx:#eaf1fb;--mu:#9db0c8;--br:#4ea1ee;--bi:#06182e;--ac:#f0b72e;--ln:#27395a;--tn:#122340}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans SC",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
section{padding:44px 0}h1,h2,h3{line-height:1.25;margin:0 0 10px}h1{font-size:clamp(1.8rem,5vw,2.8rem)}h2{font-size:1.5rem}h3{font-size:1.05rem}
p{margin:0 0 10px;color:var(--mu)}
header{border-bottom:1px solid var(--ln)}nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}.em{height:48px;width:auto;background:#fff;border-radius:10px;padding:3px 6px;display:block}.nm{font:800 clamp(1.35rem,5.2vw,2rem)/1 "Arial Narrow","Roboto Condensed",Impact,system-ui,sans-serif;letter-spacing:.5px;color:var(--br)}.nm b{color:var(--ac)}.hl{display:inline-block;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 16px;margin-top:14px}.hl img{display:block;width:min(100%,380px);height:auto}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;margin-top:4px}
nav select{width:auto;margin:0;padding:8px}
.hg{display:grid;gap:28px;padding:36px 0 44px}@media(min-width:820px){.hg{grid-template-columns:1.05fr 1fr;align-items:center}}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--tn);color:var(--br);padding:6px 12px;border-radius:14px;font-size:.85rem;font-weight:600;margin-bottom:14px}
.fl{width:30px;height:20px;border-radius:3px;border:1px solid var(--ln);flex:none;display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card label{display:block;font-size:.88rem;font-weight:600;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--br);background:var(--tn);font-weight:600}
.btn{display:block;text-align:center;background:var(--br);color:var(--bi);padding:14px;border-radius:999px;font-weight:700;text-decoration:none;margin-top:16px}
.note{font-size:.8rem;margin:12px 0 0}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:16px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}.c p{margin:0}
.band{background:var(--tn)}
ol{counter-reset:s;list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
li{counter-increment:s;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 14px 14px 58px;position:relative;font-weight:600}
li::before{content:counter(s);position:absolute;left:14px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--ac);color:#1d2433;display:grid;place-items:center}
footer{border-top:1px solid var(--ln);padding:24px 0;font-size:.82rem;color:var(--mu)}
</style>
